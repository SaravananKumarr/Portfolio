<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route not found | Saravanan Kumar</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  // Redirect to the portfolio root and show its built-in "Route not found" screen
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var base = location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : '/';
    location.replace(base + '#lost');
  })();
</script>
</head>
<body style="background:#03020a;color:#29e0e8;font-family:sans-serif;display:grid;place-items:center;min-height:100vh;margin:0">
  <p>Redirecting… <a href="./" style="color:#ff3d6e">Return to home base</a></p>
</body>
</html>
